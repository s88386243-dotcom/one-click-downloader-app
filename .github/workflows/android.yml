name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Keystore and Properties
        run: |
          keytool -genkey -v -keystore release.keystore -alias oneclick -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=OneClickDownloader, OU=App, O=Dev, L=City, S=State, C=IN"
          cat <<EOF > keystore.properties
          keyAlias=oneclick
          keyPassword=android
          storePassword=android
          storeFile=$GITHUB_WORKSPACE/release.keystore
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Generic Release APK
        run: ./gradlew assembleGenericRelease --stacktrace

      - name: List Generated APKs
        run: |
          cp app/build/outputs/apk/generic/release/*universal*.apk app/build/outputs/apk/generic/release/OneClickDownloader.apk
          ls -la app/build/outputs/apk/generic/release/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneClickDownloader-APKs
          path: app/build/outputs/apk/generic/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.5
          name: "One Click Downloader v2.0.5 (New 3D Logo, Monetization & Community)"
          body: |
            ### ⚡ One Click Downloader v2.0.5

            #### 🌟 What's New:
            - 🎨 **Trending 3D App Icon**: Replaced default launcher with ultra-modern electric neon 3D squircle logo.
            - 📢 **Official Telegram Channel**: Added community channel link (t.me/+pz895xwIR7RjMGFl) in About page.
            - 💰 **Start.io Monetization**: High-paying video interstitial ad on download completion.
            - 📱 **Spacious UI**: Big touch-friendly video and MP3 download buttons.
            - 🌐 **Connected to Website**: Linked with https://one-click-downloader.antideploy.app
            - 🔄 **In-App Auto Update**: Connected to personal repository.

            #### 📥 Download Links:
            - **Universal APK** (Recommended): `OneClickDownloader.apk`
          files: app/build/outputs/apk/generic/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
