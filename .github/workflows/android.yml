name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Keystore and Properties
        run: |
          keytool -genkey -v -keystore release.keystore -alias oneclick -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=OneClickDownloader, OU=App, O=Dev, L=City, S=State, C=IN"
          cat <<EOF > keystore.properties
          keyAlias=oneclick
          keyPassword=android
          storePassword=android
          storeFile=$GITHUB_WORKSPACE/release.keystore
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Generic Release APK
        run: ./gradlew assembleGenericRelease --stacktrace

      - name: List Generated APKs
        run: ls -la app/build/outputs/apk/generic/release/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneClickDownloader-APKs
          path: app/build/outputs/apk/generic/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "One Click Downloader v2.0.0"
          body: |
            ### ⚡ One Click Downloader APK

            A powerful, all-in-one social media downloader for Android (built on the Seal open-source engine).

            #### 📥 Download Instructions:
            - **Universal APK** (Recommended - works on all Android phones): `OneClickDownloader-*-universal.apk`
            - **ARM64 APK** (For modern phones): `OneClickDownloader-*-arm64-v8a.apk`

            #### ✨ Features:
            - 🎯 Download Instagram Reels, Stories, Posts & Photos
            - 📺 Download YouTube Videos, Shorts & Audio (MP3)
            - 🎬 Download Facebook Reels & Videos
            - 🔄 In-app engine updates to keep downloads working smoothly!
          files: app/build/outputs/apk/generic/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
